<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Base Number System Hub</title>
    <style>
        :root {
            --bg-primary: #0f1115;
            --bg-surface: #1a1d24;
            --bg-panel: #111318;
            --accent: #ff8c00;
            --accent-hover: #e07b00;
            --text-main: #f5f6f9;
            --text-muted: #8e95a5;
            --gray-disabled: #282c37;
            --correct: #2e7d32;
            --incorrect: #c62828;
            --border: #2c313c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background-color: var(--bg-surface);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 18px;
        }

        header h1 {
            color: var(--accent);
            font-size: 26px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            background: var(--bg-panel);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .guide-box {
            background: rgba(255, 140, 0, 0.04);
            border-left: 4px solid var(--accent);
            padding: 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.6;
        }

        .guide-box ul {
            margin-left: 20px;
            margin-top: 6px;
        }

        .calc-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .calc-layout {
                grid-template-columns: 1.1fr 1fr;
            }
        }

        .display-panel {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .base-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            border-radius: 6px;
            transition: background 0.2s;
        }

        .base-row:last-child {
            border-bottom: none;
        }

        .base-label {
            font-weight: 800;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .base-value {
            font-size: 20px;
            font-family: "SF Mono", SFMono-Regular, Consolas, monospace;
            font-weight: 600;
            word-break: break-all;
            text-align: right;
        }

        .base-row.selected {
            background: rgba(255, 140, 0, 0.08);
            border: 1px solid rgba(255, 140, 0, 0.2);
        }

        .base-row.selected .base-label {
            color: var(--accent);
        }

        .base-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .base-radio {
            flex: 1;
        }

        .base-radio input {
            display: none;
        }

        .base-radio label {
            display: block;
            padding: 12px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .base-radio input:checked + label {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.2);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .key {
            padding: 18px 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 18px;
            font-weight: bold;
            font-family: "SF Mono", Consolas, monospace;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .key:active {
            transform: scale(0.96);
        }

        .key.action-key {
            background: #222630;
            color: var(--accent);
            border-color: #313745;
        }

        .key.clear-key {
            background: rgba(198, 40, 40, 0.1);
            color: #ff5252;
            border-color: rgba(198, 40, 40, 0.2);
        }

        .key:disabled, .key.grayed-out {
            background: var(--gray-disabled) !important;
            color: #4a5160 !important;
            border-color: #1f222a !important;
            opacity: 0.25;
            cursor: not-allowed;
            transform: none !important;
            pointer-events: none;
        }

        .steps-panel {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-height: 540px;
            overflow-y: auto;
        }

        .steps-panel h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .step-section {
            margin-bottom: 20px;
        }

        .step-section:last-child {
            margin-bottom: 0;
        }

        .step-section h4 {
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .step-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 13px;
        }

        .step-table th, .step-table td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            font-family: "SF Mono", Consolas, monospace;
        }

        .step-table th {
            background: rgba(255,255,255,0.02);
            color: var(--text-muted);
            font-weight: 600;
        }

        .quiz-card {
            background: var(--bg-panel);
            padding: 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .quiz-question {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .quiz-input-group {
            display: flex;
            max-width: 420px;
            margin: 0 auto 20px auto;
            gap: 10px;
        }

        .quiz-field {
            flex: 1;
            padding: 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: #fff;
            font-size: 20px;
            font-family: "SF Mono", Consolas, monospace;
            border-radius: 8px;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.2s;
        }

        .quiz-field:focus {
            border-color: var(--accent);
        }

        .quiz-submit {
            padding: 14px 28px;
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quiz-submit:hover {
            background: var(--accent-hover);
        }

        .feedback-banner {
            padding: 14px;
            border-radius: 8px;
            margin-top: 16px;
            font-weight: bold;
            font-size: 14px;
            display: none;
            text-align: left;
        }

        .feedback-banner.success {
            display: block;
            background: rgba(46, 125, 50, 0.1);
            color: #a5d6a7;
            border-left: 4px solid var(--correct);
        }

        .feedback-banner.error {
            display: block;
            background: rgba(198, 40, 40, 0.1);
            color: #ef9a9a;
            border-left: 4px solid var(--incorrect);
        }
.score-counter {
font-size: 14px;
color: var(--text-muted);
margin-top: 16px;
font-weight: 500;
}
